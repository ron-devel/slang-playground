name: Android CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - 'renderer/android/**'
      - 'renderer/core/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android platform, build-tools, and NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Verify NDK toolchain is present
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            && echo "NDK clang found at $NDK_DIR" \
            || (echo "NDK clang not found" && exit 1)

      - name: Make NDK location available to cargo-ndk
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust toolchain with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
          key: android-ndk

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace
