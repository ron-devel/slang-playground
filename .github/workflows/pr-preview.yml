name: Deploy PR Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

    paths-ignore:
      - 'bridge/**'
      - '.github/workflows/bridge-ci.yml'
      - 'renderer/**'
      - '.github/workflows/renderer-ci.yml'
      - 'android-app/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and cache WASM dependencies
        uses: ./.github/actions/build-wasm-deps
        with:
          build-artifacts-dir: ./src

      - name: Copy types to compilation engine
        run: |
          cp ./src/slang-wasm.d.ts ./engine/slang-compilation-engine/media/slang-wasm.d.ts
          cp ./src/spirv-tools.d.ts ./engine/slang-compilation-engine/media/spirv-tools.d.ts

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
        run: |
          npm install
          npm run build

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const url = `https://${owner.toLowerCase()}.github.io/${repo}/pr-${prNumber}/`;
            const marker = '<!-- pr-preview-link -->';
            const body = `${marker}\n🔗 Preview: ${url}\n\n(updates automatically on each push to this PR)`;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
