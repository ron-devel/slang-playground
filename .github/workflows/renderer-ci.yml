name: Renderer CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'renderer/**'
      - '.github/workflows/renderer-ci.yml'

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - name: Install Vulkan headers and a software (CPU) Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

      - name: Check formatting
        run: cargo fmt --check

      # renderer-android depends on ndk-sys, which only compiles when
      # actually targeting Android (cross-compiled via cargo-ndk, see
      # android-ci.yml) — excluded here since this runner has no NDK.
      - name: Build
        run: cargo build --workspace --all-targets --exclude renderer-android

      - name: Test
        run: cargo test --workspace --exclude renderer-android

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude renderer-android -- -D warnings
