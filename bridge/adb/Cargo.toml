[package]
name = "bridge-adb"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "time"] }
tracing = "0.1"

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
