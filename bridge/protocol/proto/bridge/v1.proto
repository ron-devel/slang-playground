syntax = "proto3";

package bridge.v1;

// The role a peer identifies itself as when it connects.
enum PeerRole {
  PEER_ROLE_UNSPECIFIED = 0;
  // The web playground UI (browser tab).
  PEER_ROLE_UI = 1;
  // A render target (Android app, embedded desktop app, ...).
  PEER_ROLE_TARGET = 2;
}

// First message a peer must send after opening the WebSocket connection.
message Hello {
  PeerRole role = 1;
  // Human-readable name shown in the UI's device picker (e.g. device model).
  string display_name = 2;
}

// Server's reply to a valid Hello.
message HelloAck {
  string session_id = 1;
}

message TargetInfo {
  string session_id = 1;
  string display_name = 2;
}

// Sent to every UI peer whenever the connected target changes: on a UI
// peer's initial connection (reflecting current state), when a target
// connects, and when it disconnects. Absent `target` means none is
// currently connected.
message PresenceUpdate {
  TargetInfo target = 1;
}

// Sent by a UI peer to deliver a shader for the currently connected
// target to render. The daemon relays this verbatim to whichever target
// is connected when it arrives; if none is, it's dropped (there's
// nothing to relay it to, and no queued-delivery semantics yet).
//
// Matches the web playground's own execution model today: a compute
// entry point that writes into a single fixed-size-to-screen storage
// image (`outputTexture` in the playground's Slang sources), which the
// target then blits to its own display — the same two-stage shape the
// browser's own WebGPU canvas uses (a fixed pass-through vertex/fragment
// pair blitting the compute output). A target-side graphics (vertex +
// fragment) pipeline is future work, for playground content that isn't
// just this single-output-texture compute shape.
message ShaderUpdate {
  bytes compute_spirv = 1;
  string entry_point = 2;
  uint32 thread_group_size_x = 3;
  uint32 thread_group_size_y = 4;
  uint32 thread_group_size_z = 5;
  // The descriptor binding index the compiled shader expects its output
  // storage image at (Slang assigns this; not assumed to be a fixed
  // constant like 0, since the compiler's assignment isn't part of this
  // protocol's contract).
  uint32 output_texture_binding = 6;

  // A shader may also declare global scalar/vector uniforms the
  // playground auto-provides without any user interaction beyond touch
  // (currently TIME/FRAME_ID/MOUSE_POSITION — anything driven by the
  // uniform panel, like SLIDER/COLOR_PICK, needs input plumbing a
  // target doesn't have yet). When present, these are packed by the
  // compiler into a single uniform buffer, always at descriptor binding
  // 0 (observed empirically across every compiled example so far —
  // Slang gives the implicit uniform block priority over explicitly-
  // declared resources like the output texture, which get shifted to
  // binding 1+ instead; this matches what this same compiler's WebGPU-
  // target output already assumes for its own uniform buffer binding).
  // 0 means no uniform buffer is needed at all.
  uint32 uniform_buffer_size = 7;
  optional uint32 time_offset = 8;
  optional uint32 frame_id_offset = 9;
  // Byte offset of a packed float4 [x, y, lastDownX * (isDown ? -1 :
  // 1), lastDownY * (everClicked ? -1 : 1)], matching the web
  // playground's own MOUSE_POSITION encoding (see RenderCanvas.vue's
  // writeUniformData) so shaders behave identically on both targets.
  // Coordinates are in the target's own surface pixel space, top-left
  // origin, not normalized.
  optional uint32 mouse_position_offset = 10;
}

// Top-level envelope for every message sent over the bridge WebSocket.
message Envelope {
  oneof message {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    PresenceUpdate presence_update = 3;
    ShaderUpdate shader_update = 4;
  }
}
