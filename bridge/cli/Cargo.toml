[package]
name = "bridge-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "slang-bridge"
path = "src/main.rs"

[dependencies]
bridge-core = { path = "../core" }
bridge-adb = { path = "../adb" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
